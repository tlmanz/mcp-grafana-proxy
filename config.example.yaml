# Config file for the CLI modes (exec, serve, login, doctor, token). The web UI
# (`mcp-grafana-proxy ui`, or Docker) keeps its own encrypted store instead.
#
# Location: mcp-grafana-proxy/config.yaml in the user config directory
# (Linux: ~/.config, macOS: ~/Library/Application Support), or the path in
# MCP_GRAFANA_PROXY_CONFIG.

environments:
  dev:
    upstream: https://grafana.dev.example.com   # Grafana base URL behind IAP (a sub-path is fine)
    listen: 127.0.0.1:18080                     # serve mode only; exec mode picks a free port
    auth:
      # Sign in with IAP's own OAuth client: run `mcp-grafana-proxy login --env dev`
      # once, after adding http://127.0.0.1:18085/ to the client's Authorized
      # redirect URIs.
      mode: oauth-client
      client_id: 1234567890-abc.apps.googleusercontent.com   # IAP's OAuth client ID
      client_secret_file: dev-client-secret   # the bare secret, or the client JSON from the console;
                                              # relative to this file; keep it chmod 600
      # account: you@example.com              # preselected at sign-in
      # redirect_port: 18085                  # must match the registered redirect URI

  # Service account impersonation. Works with any IAP OAuth client, including
  # the Google-managed one, if you have Service Account Token Creator on an
  # account that has IAP access. Grafana's IAP header then names the account.
  # shared:
  #   upstream: https://grafana-shared.example.com
  #   listen: 127.0.0.1:18081
  #   auth:
  #     mode: impersonate-jwt
  #     service_account: grafana-mcp@my-project.iam.gserviceaccount.com
